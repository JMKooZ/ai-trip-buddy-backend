app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

spring:
  application:
    name: ai-trip-buddy-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_trip_buddy
    username: postgres
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_OAUTH_CLIENT_ID}
            client-secret: ${NAVER_OAUTH_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "${app.frontend-url}/api/login/oauth2/code/{registrationId}"
            scope: name,email
            client-name: Naver
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${app.frontend-url}/api/login/oauth2/code/{registrationId}"
            scope: profile_nickname
#            , account_email
            client-name: Kakao
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

naver:
  maps:
    client-id: ${NAVER_MAPS_CLIENT_ID}
    client-secret: ${NAVER_MAPS_CLIENT_SECRET}

  api-hub:
    client-id: ${NAVER_API_HUB_CLIENT_ID}
    client-secret: ${NAVER_API_HUB_CLIENT_SECRET}